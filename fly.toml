# fly.toml app configuration file generated for pleasant-conversation on 2026-07-31T06:30:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pleasant-conversation'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  FORCE_SSL = 'true'
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  RAILS_MAX_THREADS = '5'

[[mounts]]
  source = 'sqlite_data'
  destination = '/rails/storage'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
